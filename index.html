<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #000; /* Background hitam agar gambar menyatu */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Menghilangkan scrollbar */
        }

        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <img src="cinema.jpg" alt="Cinema">
</body>
</html>
